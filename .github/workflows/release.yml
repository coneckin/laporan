name: Build and Release Laporan PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Tentukan versi tag
        id: tag
        run: |
          echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Compile Dokumen LaTeX Laporan
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Siapkan Artefak PDF
        run: |
          cp main.pdf Laporan-Proyek2-Coneckin.pdf

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Laporan Proyek 2 ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            Laporan-Proyek2-Coneckin.pdf
